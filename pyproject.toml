[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "foheart-linux"
version = "0.1.0"
description = "MotionVenus UDP skeleton retargeting to Unitree G1 simulation"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "matplotlib>=3.7",
    "numpy>=1.23",
    "PyYAML>=6",
    "pyusb>=1.2",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.pytest.ini_options]
testpaths = ["tests"]
